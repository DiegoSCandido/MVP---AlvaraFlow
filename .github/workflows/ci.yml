name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      # Nenhum teste toca o banco, mas o `prisma generate` do postinstall
      # e o carregamento de env.ts exigem as variaveis presentes.
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-secret-nao-usado-em-producao"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
